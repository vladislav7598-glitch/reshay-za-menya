*{box-sizing:border-box}
body{
 margin:0;
 background:#101016;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 min-height:100vh;
}
header{
 padding:30px 20px 20px;
 text-align:center;
}
h1{font-size:30px;margin:0 0 8px}
.subtitle{color:#aaa;font-size:14px}
main{max-width:600px;margin:auto;padding:15px}
.section-title{font-size:19px;margin:20px 0 15px}
.categories{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.category{
 background:#1b1b26;
 border:1px solid #303040;
 border-radius:18px;
 padding:20px 12px;
 color:white;
 text-align:center;
 font-size:16px;
 cursor:pointer;
}
.category:active{transform:scale(.97)}
.category .emoji{
 font-size:30px;
 display:block;
 margin-bottom:10px;
}
.panel{
 background:#1b1b26;
 border:1px solid #303040;
 border-radius:20px;
 padding:18px;
 margin-top:20px;
}
.hidden{display:none}
.option{
 background:#262635;
 border-radius:13px;
 padding:15px;
 margin:10px 0;
 cursor:pointer;
 border:1px solid transparent;
 transition:.15s;
}
.option.selected{
 border-color:#a36cff;
 background:#302541;
}
button{
 border:0;
 border-radius:14px;
 padding:15px 18px;
 font-size:15px;
 font-weight:600;
 cursor:pointer;
}
.primary{
 width:100%;
 background:linear-gradient(135deg,#9a5cff,#7040d8);
 color:white;
 margin-top:12px;
}
.secondary{
 background:#303040;
 color:white;
 width:100%;
 margin-top:10px;
}
.result{
 text-align:center;
 padding:20px 5px;
}
.result h2{font-size:24px}
.result p{color:#ccc;line-height:1.5}
.nav{
 display:flex;
 gap:10px;
 margin-top:20px;
}
.nav button{flex:1}
.small-text{
 color:#999;
 font-size:13px;
 text-align:center;
 margin-top:12px;
}
</style>
</head>

<body>
<header>
 <h1>Решай за меня</h1>
 <div class="subtitle">Меньше сомнений — больше действий</div>
</header>

<main>

<section id="home">
 <div class="section-title">Что будем решать?</div>
 <div class="categories" id="categories"></div>
 <div class="nav">
  <button class="secondary" onclick="showFavorites()">❤️ Избранное</button>
  <button class="secondary" onclick="showHistory()">🕘 История</button>
 </div>
</section>

<section id="choices" class="hidden">
 <div class="section-title" id="categoryTitle"></div>
 <div class="small-text">Выбери вариант или доверь решение нам</div>
 <div id="options"></div>
 <button class="primary" onclick="chooseRandom()">🎲 Выбери за меня!</button>
 <button class="secondary" onclick="newOptions()">🔄 Другие варианты</button>
 <button class="secondary" onclick="goHome()">← На главную</button>
</section>

<section id="result" class="hidden panel">
 <div class="result">
  <div style="font-size:45px">✨</div>
  <h2>Мой выбор</h2>
  <p id="resultText"></p>
  <button class="primary" onclick="saveFavorite()">❤️ В избранное</button>
  <button class="secondary" onclick="chooseRandom()">🎲 Ещё раз</button>
  <button class="secondary" onclick="goHome()">На главную</button>
 </div>
</section>

<section id="saved" class="hidden">
 <div class="section-title" id="savedTitle"></div>
 <div id="savedList"></div>
 <button class="secondary" onclick="goHome()">← На главную</button>
</section>

</main>

let current=null;
let selected=null;
let currentOptions=[];
let lastResult=null;
let shownOptions=[];

function show(id){
 ["home","choices","result","saved"].forEach(x=>
  document.getElementById(x).classList.add("hidden")
 );
 document.getElementById(id).classList.remove("hidden");
}

function renderCategories(){
 document.getElementById("categories").innerHTML=data.map((c,i)=>
 `<div class="category" onclick="openCategory(${i})">
  <span class="emoji">${c.emoji}</span>${c.name}
 </div>`
 ).join("");
}

function openCategory(i){
 current=i;
 shownOptions=[];
 selected=null;
 document.getElementById("categoryTitle").textContent=data[i].name;
 newOptions();
 show("choices");
}

function newOptions(){
 const allItems=data[current].items;
 let available=allItems.filter(item=>!shownOptions.includes(item));

 if(available.length<5){
  shownOptions=[];
  available=[...allItems];
 }

 currentOptions=[];

 while(currentOptions.length<5 && available.length){
  const n=Math.floor(Math.random()*available.length);
  const item=available.splice(n,1)[0];
  currentOptions.push(item);
  shownOptions.push(item);
 }

 selected=null;

 document.getElementById("options").innerHTML=currentOptions.map((item,i)=>
 `<div class="option" onclick="selectOption(${i})" id="option${i}">${item}</div>`
 ).join("");
}

function selectOption(i){
 selected=i;
 document.querySelectorAll(".option").forEach((el,n)=>
  el.classList.toggle("selected",n===i)
 );
}

function chooseRandom(){
 if(!currentOptions.length)return;

 const index=selected!==null
  ? selected
  : Math.floor(Math.random()*currentOptions.length);

 lastResult=currentOptions[index];

 saveHistory(lastResult);
 document.getElementById("resultText").textContent=lastResult;
 show("result");
 selected=null;
}

function saveHistory(value){
 let h=JSON.parse(localStorage.getItem("history")||"[]");
 h.unshift(value);
 localStorage.setItem("history",JSON.stringify(h.slice(0,50)));
}

function saveFavorite(){
 if(!lastResult)return;

 let f=JSON.parse(localStorage.getItem("favorites")||"[]");

 if(!f.includes(lastResult)){
  f.unshift(lastResult);
  localStorage.setItem("favorites",JSON.stringify(f));
 }

 alert("Добавлено в избранное!");
}

function showFavorites(){
 showSaved("Избранное","favorites");
}

function showHistory(){
 showSaved("История","history");
}

function showSaved(title,key){
 const items=JSON.parse(localStorage.getItem(key)||"[]");

 document.getElementById("savedTitle").textContent=title;

 document.getElementById("savedList").innerHTML=items.length
  ? items.map(x=>`<div class="option">${escapeHTML(x)}</div>`).join("")
  : "<p>Пока здесь пусто.</p>";

 show("saved");
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,char=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 })[char]);
}

function goHome(){
 show("home");
}

renderCategories();

 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js")
   .catch(error=>console.log("Ошибка Service Worker:",error));
