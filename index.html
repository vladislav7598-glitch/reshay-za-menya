
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101016">
<link rel="manifest" href="./manifest.json">
<title>Решай за меня</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101016;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{border:0;cursor:pointer;color:white}
.app{max-width:650px;margin:auto;min-height:100vh;padding:24px 18px 45px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.logo{font-size:21px;font-weight:800;letter-spacing:-.5px}
.logo span{color:#a78bfa}
.icon-btn{background:#24212f;border-radius:13px;padding:11px 13px;font-size:17px}
h1{font-size:29px;line-height:1.15;margin:12px 0}
.subtitle{color:#9995a8;line-height:1.5;margin-bottom:25px}
.section-title{font-size:19px;font-weight:750;margin:25px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.category{min-height:120px;text-align:left;padding:17px;border-radius:19px;background:linear-gradient(145deg,#272238,#1b1925);border:1px solid #393148}
.category:active,.option:active{transform:scale(.98)}
.category .emoji{font-size:27px;display:block;margin-bottom:13px}
.category strong{font-size:16px;display:block}
.category small{display:block;color:#aaa4b8;margin-top:6px}
.panel{background:#1b1925;border:1px solid #302b3b;border-radius:19px;padding:17px;margin:14px 0}
.primary{width:100%;padding:16px;border-radius:15px;background:linear-gradient(100deg,#8055e9,#a16af5);font-weight:750;font-size:16px;margin-top:12px}
.secondary{width:100%;padding:14px;border-radius:14px;background:#292536;color:#ddd8e8;font-weight:650;margin-top:10px}
.back{background:transparent;color:#b9a4ff;padding:8px 0;font-size:15px;margin-bottom:12px}
.options{display:grid;gap:10px;margin-top:18px}
.option{background:#211e2c;border:1px solid #393247;border-radius:16px;padding:17px;text-align:left}
.option strong{display:block;font-size:16px}
.option small{display:block;color:#aaa4b8;margin-top:5px;line-height:1.4}
.option.delivery-option{border:1px solid #8b65d5;background:linear-gradient(120deg,#302344,#211e2c)}
.search{width:100%;background:#211e2c;border:1px solid #393247;border-radius:13px;padding:14px;color:white;margin:14px 0;outline:none}
.search::placeholder{color:#817b8e}
.result{background:#211e2c;border:1px solid #393247;border-radius:16px;padding:17px;margin-top:12px}
.result h3{margin:0 0 7px}
.muted{color:#aaa4b8;line-height:1.5}
.tag{display:inline-block;background:#302943;color:#c8b5ff;border-radius:20px;padding:6px 10px;font-size:12px;margin:4px 4px 4px 0}
.footer{color:#716c7d;font-size:12px;text-align:center;margin-top:35px}
.hidden{display:none!important}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small-btn{background:#302943;padding:9px 12px;border-radius:11px}
@media(max-width:380px){.app{padding:18px 14px}.category{padding:14px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">Решай <span>за меня</span></div>
  <button class="icon-btn" onclick="showSaved()">♡</button>
</header>

<main id="app"></main>
<div class="footer">Меньше сомнений — больше действий.</div>
</div>

<script>
const movies = [
{title:"Брат",type:"Кино",genre:"Драма",year:1997,country:"Россия"},
{title:"Брат 2",type:"Кино",genre:"Боевик",year:2000,country:"Россия"},
{title:"Лёд",type:"Кино",genre:"Мелодрама",year:2018,country:"Россия"},
{title:"Холоп",type:"Кино",genre:"Комедия",year:2019,country:"Россия"},
{title:"Движение вверх",type:"Кино",genre:"Драма",year:2017,country:"Россия"},
{title:"Майор Гром: Чумной Доктор",type:"Кино",genre:"Боевик",year:2021,country:"Россия"},
{title:"Т-34",type:"Кино",genre:"Боевик",year:2018,country:"Россия"},
{title:"Пара из будущего",type:"Кино",genre:"Фантастика",year:2021,country:"Россия"},
{title:"Операция «Ы»",type:"Кино",genre:"Комедия",year:1965,country:"Россия"},
{title:"Иван Васильевич меняет профессию",type:"Кино",genre:"Комедия",year:1973,country:"Россия"},
{title:"Начало",type:"Кино",genre:"Фантастика",year:2010,country:"США"},
{title:"Интерстеллар",type:"Кино",genre:"Фантастика",year:2014,country:"США"},
{title:"Матрица",type:"Кино",genre:"Фантастика",year:1999,country:"США"},
{title:"Остров проклятых",type:"Кино",genre:"Триллер",year:2010,country:"США"},
{title:"Зелёная миля",type:"Кино",genre:"Драма",year:1999,country:"США"},
{title:"Побег из Шоушенка",type:"Кино",genre:"Драма",year:1994,country:"США"},
{title:"Джентльмены",type:"Кино",genre:"Криминал",year:2019,country:"Великобритания"},
{title:"Большой куш",type:"Кино",genre:"Криминал",year:2000,country:"Великобритания"},
{title:"Форсаж",type:"Кино",genre:"Боевик",year:2001,country:"США"},
{title:"Грань будущего",type:"Кино",genre:"Фантастика",year:2014,country:"США"},
{title:"1+1",type:"Кино",genre:"Комедия",year:2011,country:"Франция"},
{title:"Паразиты",type:"Кино",genre:"Триллер",year:2019,country:"Южная Корея"},
{title:"Игра в кальмара",type:"Сериал",genre:"Триллер",year:2021,country:"Южная Корея"},
{title:"Бригада",type:"Сериал",genre:"Криминал",year:2002,country:"Россия"},
{title:"Метод",type:"Сериал",genre:"Детектив",year:2015,country:"Россия"},
{title:"Кухня",type:"Сериал",genre:"Комедия",year:2012,country:"Россия"},
{title:"Мажор",type:"Сериал",genre:"Детектив",year:2014,country:"Россия"},
{title:"Слово пацана",type:"Сериал",genre:"Драма",year:2023,country:"Россия"},
{title:"Эпидемия",type:"Сериал",genre:"Фантастика",year:2019,country:"Россия"},
{title:"Во все тяжкие",type:"Сериал",genre:"Криминал",year:2008,country:"США"},
{title:"Шерлок",type:"Сериал",genre:"Детектив",year:2010,country:"Великобритания"},
{title:"Игра престолов",type:"Сериал",genre:"Фэнтези",year:2011,country:"США"},
{title:"Очень странные дела",type:"Сериал",genre:"Фантастика",year:2016,country:"США"},
{title:"Чернобыль",type:"Сериал",genre:"Драма",year:2019,country:"США"}
];

const genres=["Боевик","Комедия","Драма","Фантастика","Триллер","Криминал","Детектив","Мелодрама","Фэнтези"];

const cookGroups = {
"Русская кухня":["Борщ","Пельмени","Блины","Плов","Котлеты с пюре","Голубцы","Щи","Сырники"],
"Итальянская кухня":["Паста карбонара","Пицца Маргарита","Лазанья","Ризотто","Спагетти болоньезе","Брускетта"],
"Японская кухня":["Роллы","Суши","Рамен","Удон","Терияки с рисом","Мисо-суп"],
"Китайская кухня":["Лапша вок","Курица в кисло-сладком соусе","Жареный рис","Пельмени гёдза"],
"Грузинская кухня":["Хачапури","Хинкали","Чахохбили","Лобио","Шашлык"],
"Французская кухня":["Круассаны","Луковый суп","Рататуй","Киш","Жюльен"],
"Корейская кухня":["Корейская курица","Кимчи","Пибимпап","Токпокки"],
"Мексиканская кухня":["Тако","Буррито","Кесадилья","Начос"],
"Турецкая кухня":["Донер","Кебаб","Менемен","Пиде"],
"Индийская кухня":["Карри","Курица тикка масала","Бирьяни","Самоса"],
"Тайская кухня":["Пад тай","Том ям","Зелёное карри"],
"Американская кухня":["Бургер","Хот-дог","Стейк","Рёбрышки барбекю"],
"Греческая кухня":["Греческий салат","Мусака","Сувлаки"],
"Испанская кухня":["Паэлья","Тортилья","Гаспачо"],
"Восточная кухня":["Шаурма","Манты","Лагман","Самса","Долма"]
};

const cookTypes = {
"Завтраки":["Омлет","Сырники","Блины","Овсянка","Яичница","Тосты"],
"Супы":["Борщ","Куриный суп","Солянка","Том ям","Грибной крем-суп","Щи"],
"Основные блюда":["Плов","Паста","Котлеты с пюре","Рыба с овощами","Лазанья","Жаркое"],
"Салаты":["Цезарь","Греческий салат","Оливье","Салат с тунцом","Винегрет"],
"Десерты":["Чизкейк","Тирамису","Блины с начинкой","Шарлотка","Панкейки"],
"Выпечка":["Пицца","Хачапури","Самса","Круассаны","Пирожки"],
"Перекусы":["Сэндвич","Шаурма","Бургер","Хот-дог","Тосты"]
};

const cookSituations = {
"Быстро — до 20 минут":["Омлет","Паста с сыром","Сэндвич","Салат с тунцом","Яичница"],
"Недорого":["Гречка с котлетой","Макароны по-флотски","Картошка с яйцом","Овсянка","Драники"],
"Для всей семьи":["Курица с картошкой","Плов","Пельмени","Пицца","Котлеты с пюре"],
"Для гостей":["Лазанья","Жаркое","Цезарь","Запечённая рыба","Мясо по-французски"],
"Полезное питание":["Рыба с овощами","Куриная грудка","Греческий салат","Овсянка","Овощной суп"],
"Что-нибудь необычное":["Рамен","Пад тай","Тако","Том ям","Пибимпап"]
};

const genericData={
go:["Прогуляться в парке","Сходить в кино","Посетить кафе","Съездить за город","Зайти в музей","Погулять по центру","Посетить новое место"],
do:["Посмотреть интересный фильм","Почитать книгу","Заняться спортом","Попробовать новое хобби","Сыграть в игру","Приготовить что-нибудь новое","Устроить вечер без телефона"],
gift:["Сертификат","Наушники","Книга","Парфюм","Настольная игра","Аксессуар","Подарочный набор"]
};

let screen="home";
let watchType="Кино";
let selectedGenre="";
let currentCookMode="";
let currentCookGroup="";
let currentCookCategory="";
let currentDishes=[];
let currentGeneric="";
let history=JSON.parse(localStorage.getItem("rzm_history")||"[]");
let saved=JSON.parse(localStorage.getItem("rzm_saved")||"[]");

const root=document.getElementById("app");
function random(arr){return arr[Math.floor(Math.random()*arr.length)]}
function saveHistory(item){
 history.unshift({title:item,date:new Date().toLocaleString("ru-RU")});
 history=history.slice(0,50);
 localStorage.setItem("rzm_history",JSON.stringify(history));
}
function goBack(){renderHome()}
function renderHome(){
 screen="home";
 root.innerHTML=`
 <h1>Что решаем сегодня?</h1>
 <div class="subtitle">Выбирай категорию или доверь решение нам.</div>
 <div class="grid">
 <button class="category" onclick="openWatch()"><span class="emoji">🎬</span><strong>Что посмотреть?</strong><small>Фильмы и сериалы</small></button>
 <button class="category" onclick="openCook()"><span class="emoji">🍽️</span><strong>Что приготовить?</strong><small>Идеи блюд и доставка</small></button>
 <button class="category" onclick="openGeneric('go')"><span class="emoji">📍</span><strong>Куда сходить?</strong><small>Места и впечатления</small></button>
 <button class="category" onclick="openGeneric('do')"><span class="emoji">⚡</span><strong>Чем заняться?</strong><small>Идеи для свободного времени</small></button>
 <button class="category" onclick="openGeneric('gift')"><span class="emoji">🎁</span><strong>Что подарить?</strong><small>Идеи подарков</small></button>
 <button class="category" onclick="randomEverything()"><span class="emoji">🎲</span><strong>Случайный выбор</strong><small>Пусть решает случай</small></button>
 </div>
 <button class="secondary" onclick="showHistory()">История выборов</button>`;
}
function openWatch(){
 screen="watch";
 root.innerHTML=`<button class="back" onclick="renderHome()">← Назад</button>
 <h1>Что посмотреть?</h1><div class="subtitle">Выбери формат или доверься случайности.</div>
 <div class="options">
 <button class="option" onclick="chooseWatchType('Кино')"><strong>🎥 Кино</strong><small>Полнометражные фильмы</small></button>
 <button class="option" onclick="chooseWatchType('Сериал')"><strong>📺 Сериалы</strong><small>Истории на несколько серий</small></button>
 <button class="option" onclick="randomMovie()"><strong>🎲 Выбери за меня</strong><small>Случайный фильм или сериал</small></button>
 </div>`;
}
function chooseWatchType(type){
 watchType=type;screen="genres";
 root.innerHTML=`<button class="back" onclick="openWatch()">← Назад</button>
 <h1>${type==="Кино"?"Выбираем фильм":"Выбираем сериал"}</h1>
 <div class="subtitle">Какой жанр тебе сегодня интересен?</div>
 <button class="primary" onclick="randomMovie('${type}')">🎲 Выбери за меня</button>
 <div class="options">${genres.map(g=>`<button class="option" onclick="openMovieCatalog('${g}')"><strong>${g}</strong><small>Подборка: ${g.toLowerCase()}</small></button>`).join("")}</div>`;
}
function openMovieCatalog(genre){
 selectedGenre=genre;screen="catalog";
 renderMovieCatalog();
}
function renderMovieCatalog(){
 let list=movies.filter(m=>m.type===watchType&&m.genre===selectedGenre);
 root.innerHTML=`<button class="back" onclick="chooseWatchType('${watchType}')">← Назад</button>
 <h1>${selectedGenre}</h1><div class="subtitle">${watchType==="Кино"?"Фильмы":"Сериалы"} этого жанра</div>
 <input class="search" id="movieSearch" placeholder="Найти по названию..." oninput="filterMovies()">
 <div id="movieList">${movieCards(list)}</div>
 <button class="primary" onclick="randomMovie('${watchType}','${selectedGenre}')">🎲 Выбери за меня</button>`;
}
function movieCards(list){
 if(!list.length)return `<div class="muted">Пока ничего не найдено.</div>`;
 return list.map(m=>`<div class="result"><div class="list-row"><h3>${m.title}</h3><button class="small-btn" onclick="toggleSaved('${m.title.replace(/'/g,"\\'")}')">${saved.includes(m.title)?"♥":"♡"}</button></div><span class="tag">${m.year}</span><span class="tag">${m.country}</span><span class="tag">${m.genre}</span></div>`).join("");
}
function filterMovies(){
 let q=document.getElementById("movieSearch").value.toLowerCase();
 let list=movies.filter(m=>m.type===watchType&&m.genre===selectedGenre&&m.title.toLowerCase().includes(q));
 document.getElementById("movieList").innerHTML=movieCards(list);
}
function randomMovie(type,genre){
 let list=movies.filter(m=>(!type||m.type===type)&&(!genre||m.genre===genre));
 if(!list.length)return;
 let m=random(list);saveHistory(m.title);
 showResult("🎬 Тебе выпало",m.title,`${m.type} · ${m.year} · ${m.country} · ${m.genre}`);
}
function openCook(){
 screen="cook";
 root.innerHTML=`<button class="back" onclick="renderHome()">← Назад</button>
 <h1>Что приготовить?</h1><div class="subtitle">Выбери, откуда начнём искать идею.</div>
 <div class="options">
 <button class="option" onclick="openCookGroups('kitchen')"><strong>🌍 Кухни мира</strong><small>Русская, итальянская, японская и другие</small></button>
 <button class="option" onclick="openCookGroups('type')"><strong>🍲 Тип блюда</strong><small>Завтраки, супы, основные блюда, десерты</small></button>
 <button class="option" onclick="openCookGroups('situation')"><strong>✨ По ситуации</strong><small>Быстро, недорого, для гостей и другое</small></button>
 </div>
 <button class="primary" onclick="randomDish()">🎲 Выбери за меня</button>`;
}
function getCookGroups(mode){
 if(mode==="kitchen")return cookGroups;
 if(mode==="type")return cookTypes;
 return cookSituations;
}
function openCookGroups(mode){
 currentCookMode=mode;screen="cookGroups";
 let groups=getCookGroups(mode);
 let heading=mode==="kitchen"?"Кухни мира":mode==="type"?"Тип блюда":"По ситуации";
 root.innerHTML=`<button class="back" onclick="openCook()">← Назад</button>
 <h1>${heading}</h1><div class="subtitle">Выбери категорию или доверься случайности.</div>
 <button class="primary" onclick="randomDishFromGroup()">🎲 Выбери за меня</button>
 <div class="options">${Object.keys(groups).map(name=>`<button class="option" onclick="openDishResults('${name.replace(/'/g,"\\'")}')"><strong>${name}</strong><small>${groups[name].length} вариантов</small></button>`).join("")}</div>`;
}
function openDishResults(name){
 currentCookGroup=name;
 currentCookCategory=name;
 currentDishes=getCookGroups(currentCookMode)[name]||[];
 screen="cookResults";
 renderDishes();
}
function renderDishes(){
 let qEl=document.getElementById("dishSearch");
 let q=qEl?qEl.value.toLowerCase():"";
 let list=currentDishes.filter(d=>d.toLowerCase().includes(q));
 root.innerHTML=`<button class="back" onclick="openCookGroups('${currentCookMode}')">← Назад</button>
 <h1>${currentCookGroup}</h1><div class="subtitle">Выбери блюдо или закажи доставку.</div>
 <input class="search" id="dishSearch" placeholder="Поиск блюда..." oninput="renderDishes()" value="${q}">
 <div class="options" id="dishList">
 ${list.map(d=>`<button class="option" onclick="selectDish('${d.replace(/'/g,"\\'")}')"><strong>🍽️ ${d}</strong><small>Выбрать это блюдо</small></button>`).join("")}
 <button class="option delivery-option" onclick="deliveryForCurrentGroup()"><strong>🛵 Заказать доставку</strong><small>Найти еду из категории «${currentCookGroup}»</small></button>
 </div>
 <button class="primary" onclick="randomDishFromResults()">🎲 Выбери за меня</button>`;
}
function selectDish(dish){
 saveHistory(dish);
 showResult("🍽️ Сегодня готовим",dish,"Отличный вариант! Приятного аппетита.");
}
function deliveryForCurrentGroup(){
 let query=(currentCookCategory||currentCookGroup||"еда")+" доставка еды";
 window.open("https://www.google.com/search?q="+encodeURIComponent(query),"_blank");
 saveHistory("Заказать доставку: "+(currentCookCategory||currentCookGroup));
}
function randomDishFromResults(){
 let options=[...currentDishes,"__DELIVERY__"];
 let choice=random(options);
 if(choice==="__DELIVERY__"){deliveryForCurrentGroup();return}
 selectDish(choice);
}
function randomDishFromGroup(){
 let groups=getCookGroups(currentCookMode);
 let names=Object.keys(groups);
 let name=random(names);
 currentCookGroup=name;currentCookCategory=name;
 let options=[...groups[name],"__DELIVERY__"];
 let choice=random(options);
 if(choice==="__DELIVERY__"){deliveryForCurrentGroup();return}
 selectDish(choice);
}
function randomDish(){
 let all=[];
 Object.entries(cookGroups).forEach(([group,items])=>items.forEach(d=>all.push({name:d,group})));
 Object.entries(cookTypes).forEach(([group,items])=>items.forEach(d=>all.push({name:d,group})));
 Object.entries(cookSituations).forEach(([group,items])=>items.forEach(d=>all.push({name:d,group})));
 all.push({name:"__DELIVERY__",group:"Еда"});
 let choice=random(all);
 currentCookCategory=choice.group;
 currentCookGroup=choice.group;
 if(choice.name==="__DELIVERY__"){deliveryForCurrentGroup();return}
 selectDish(choice.name);
}
function openGeneric(key){
 currentGeneric=key;screen="generic";
 let title=key==="go"?"Куда сходить?":key==="do"?"Чем заняться?":"Что подарить?";
 let items=genericData[key];
 root.innerHTML=`<button class="back" onclick="renderHome()">← Назад</button>
 <h1>${title}</h1><div class="subtitle">Выбери вариант или доверь решение случаю.</div>
 <button class="primary" onclick="randomGeneric()">🎲 Выбери за меня</button>
 <div class="options">${items.map(x=>`<button class="option" onclick="selectGeneric('${x.replace(/'/g,"\\'")}')"><strong>${x}</strong></button>`).join("")}</div>`;
}
function selectGeneric(x){saveHistory(x);showResult("✨ Твой вариант",x,"Решение принято!")}
function randomGeneric(){selectGeneric(random(genericData[currentGeneric]))}
function randomEverything(){
 let keys=["go","do","gift"];
 let key=random(keys);
 currentGeneric=key;
 randomGeneric();
}
function showResult(title,name,description){
 root.innerHTML=`<button class="back" onclick="renderHome()">← На главную</button>
 <div class="panel" style="text-align:center;padding:28px 18px;margin-top:30px">
 <div style="font-size:38px;margin-bottom:15px">✨</div>
 <div class="muted">${title}</div>
 <h1 style="font-size:27px;margin:14px 0">${name}</h1>
 <div class="muted">${description||""}</div>
 <button class="primary" onclick="renderHome()">Отлично!</button>
 <button class="secondary" onclick="repeatChoice()">Выбрать ещё раз</button>
 </div>`;
}
function repeatChoice(){
 if(screen==="cookResults")randomDishFromResults();
 else if(screen==="cookGroups")randomDishFromGroup();
 else if(screen==="cook")randomDish();
 else if(screen==="catalog")randomMovie(watchType,selectedGenre);
 else if(screen==="generic")randomGeneric();
 else renderHome();
}
}
function toggleSaved(name){
 if(saved.includes(name))saved=saved.filter(x=>x!==name);
 else saved.push(name);
 localStorage.setItem("rzm_saved",JSON.stringify(saved));
 if(screen==="catalog")renderMovieCatalog();
}
function showSaved(){
 screen="saved";
 root.innerHTML=`<button class="back" onclick="renderHome()">← На главную</button>
 <h1>Избранное</h1><div class="subtitle">То, что ты сохранил.</div>
 ${saved.length?saved.map(x=>`<div class="result"><div class="list-row"><strong>${x}</strong><button class="small-btn" onclick="toggleSaved('${x.replace(/'/g,"\\'")}')">Убрать ♥</button></div></div>`).join(""):`<div class="muted">Пока здесь пусто. Сохраняй фильмы, которые понравились.</div>`}`;
}
function showHistory(){
 screen="history";
 root.innerHTML=`<button class="back" onclick="renderHome()">← На главную</button>
 <h1>История выборов</h1><div class="subtitle">Недавние решения.</div>
 ${history.length?history.map(x=>`<div class="result"><strong>${x.title}</strong><div class="muted" style="font-size:12px;margin-top:6px">${x.date}</div></div>`).join(""):`<div class="muted">История пока пуста.</div>`}
 <button class="secondary" onclick="clearHistory()">Очистить историю</button>`;
}
function clearHistory(){
 history=[];localStorage.setItem("rzm_history","[]");showHistory();
}
renderHome();
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
}
</script>
</body>
</html>
