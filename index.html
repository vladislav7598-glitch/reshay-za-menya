
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101016">
<link rel="manifest" href="./manifest.json">
<title>Решай за меня</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101016;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:600px;margin:auto;padding:24px 18px 50px}
header{text-align:center;padding:22px 0 28px}
h1{font-size:30px;margin:0 0 8px}
.subtitle{color:#aaa;font-size:14px}
h2{font-size:21px;margin:25px 0 15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.category{background:#1b1b26;border:1px solid #30303e;border-radius:17px;padding:19px 13px;color:white;text-align:left;min-height:105px}
.category:active,.action:active{transform:scale(.98)}
.category .emoji{font-size:25px;display:block;margin-bottom:10px}
.category strong{font-size:15px}
.panel{display:none}
.panel.active{display:block}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:#252532;color:white;border:0;border-radius:12px;padding:11px 15px}
.options{display:grid;gap:10px;margin:20px 0}
.option{background:#1b1b26;border:1px solid #30303e;border-radius:14px;padding:15px;text-align:left;color:white}
.option.selected{border:2px solid #a879ff;background:#292139}
.action{border:0;border-radius:13px;padding:14px 16px;font-weight:700;color:white;background:#7650cf}
.action.secondary{background:#292938;border:1px solid #414151}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.result{background:#251d36;border:1px solid #8e62e4;border-radius:17px;padding:20px;margin:18px 0;text-align:center;font-size:19px;min-height:65px}
.inputrow{display:flex;gap:8px;margin:14px 0}
.inputrow input{min-width:0;flex:1;background:#1b1b26;border:1px solid #414151;border-radius:12px;padding:13px;color:white}
.small{font-size:13px;color:#aaa;margin:12px 0}
.saveditem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1b1b26;padding:12px;border-radius:12px;margin:8px 0}
.delete{background:#48252b;color:#ffaaaa;border:0;border-radius:9px;padding:8px 11px}
.tabs{display:flex;gap:8px;margin:25px 0}
.tabs button{flex:1}
.empty{color:#888;text-align:center;padding:25px 5px}
footer{text-align:center;color:#666;font-size:12px;margin-top:35px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>Решай за меня</h1>
<div class="subtitle">Меньше сомнений — больше действий</div>
</header>

<div id="home">
<h2>Что выбираем?</h2>
<div class="grid" id="categories"></div>
<div class="tabs">
<button class="action secondary" onclick="showSaved('favorites')">★ Избранное</button>
<button class="action secondary" onclick="showSaved('history')">◷ История</button>
</div>
</div>

<div id="game" class="panel">
<div class="topline">
<button class="back" onclick="goHome()">← Назад</button>
<strong id="categoryTitle"></strong>
</div>
<div id="options" class="options"></div>
<div class="actions">
<button class="action" onclick="choose()">Выбери за меня!</button>
<button class="action secondary" onclick="newOptions()">Другие варианты</button>
</div>
<div id="result" class="result">Выбери один из вариантов</div>
<div class="actions">
<button class="action secondary" onclick="addFavorite()">★ В избранное</button>
<button class="action secondary" onclick="newOptions()">Ещё раз</button>
</div>

<h2>Свои варианты</h2>
<div class="small">Добавь собственную идею — она сохранится и попадёт в общий список выбора.</div>
<div class="inputrow">
<input id="customInput" maxlength="100" placeholder="Например, посмотреть Интерстеллар">
<button class="action" onclick="addCustom()">Добавить</button>
</div>
<div id="customList"></div>
</div>

<div id="saved" class="panel">
<div class="topline">
<button class="back" onclick="goHome()">← Назад</button>
<strong id="savedTitle"></strong>
</div>
<div id="savedList"></div>
</div>

<footer>Решай за меня · Твой помощник в выборе</footer>
</div>

<script>
const data={
"Что посмотреть?":["Посмотреть интересный фильм","Выбрать захватывающий сериал","Посмотреть комедию","Найти хороший детектив","Посмотреть фантастику","Выбрать приключенческий фильм","Посмотреть документальный фильм","Посмотреть триллер","Найти фильм ужасов","Посмотреть романтическую комедию","Выбрать боевик","Посмотреть исторический фильм","Найти фильм про космос","Посмотреть мультфильм","Выбрать семейное кино","Посмотреть фильм на реальных событиях","Найти старую классику","Посмотреть фильм с неожиданной концовкой","Выбрать короткий сериал","Посмотреть криминальную драму","Найти фильм про путешествия","Посмотреть анимационный фильм","Выбрать военную драму","Посмотреть приключения","Дать шанс фильму, о котором ничего не знаешь"],
"Что приготовить?":["Приготовить пасту","Сделать домашнюю пиццу","Приготовить картошку с мясом","Сделать вкусный салат","Приготовить омлет","Попробовать новый рецепт","Приготовить что-нибудь необычное","Сделать домашние бургеры","Приготовить курицу в духовке","Сделать сырники","Приготовить суп","Сделать горячие бутерброды","Приготовить плов","Сделать блины","Приготовить запечённую рыбу","Сделать шаурму дома","Приготовить картофельное пюре","Сделать овощное рагу","Приготовить домашнюю лапшу","Сделать тёплый салат","Приготовить котлеты","Сделать запеканку","Приготовить рис с овощами","Сделать домашний десерт","Приготовить любимое блюдо детства"],
"Куда сходить?":["Сходить в кафе","Прогуляться в парке","Сходить в кино","Посетить новое место","Устроить небольшую поездку","Сходить в торговый центр","Провести время на природе","Посетить музей","Сходить в боулинг","Попробовать новый ресторан","Сходить на выставку","Посетить красивую набережную","Сходить в бассейн","Устроить прогулку по центру города","Посетить парк развлечений","Сходить в кофейню","Отправиться за город","Посетить интересное мероприятие","Сходить в книжный магазин","Устроить фотопрогулку","Посетить зоопарк","Сходить на каток","Погулять в новом районе","Сходить в театр","Найти необычное место поблизости"],
"Чем заняться?":["Послушать любимую музыку","Посмотреть интересное видео","Заняться спортом","Поиграть в игру","Почитать книгу","Навести порядок","Попробовать новое хобби","Посмотреть обучающий ролик","Приготовить что-нибудь вкусное","Позвонить старому другу","Сделать небольшую тренировку","Погулять на свежем воздухе","Разобрать фотографии","Послушать подкаст","Научиться чему-то новому","Посмотреть смешные видео","Устроить вечер настольных игр","Нарисовать что-нибудь","Составить планы на неделю","Сделать перестановку","Посмотреть старые фотографии","Попробовать медитацию","Устроить цифровой детокс","Начать интересный проект","Просто отдохнуть без телефона"],
"Что подарить?":["Подарить впечатление","Выбрать полезный аксессуар","Подарить сертификат","Подготовить необычный сюрприз","Подарить что-то сделанное своими руками","Выбрать красивую вещь","Организовать совместный отдых","Подарить книгу","Выбрать оригинальную кружку","Подарить набор сладостей","Подарить настольную игру","Выбрать стильный аксессуар","Подарить комнатное растение","Сделать фотокнигу","Подарить билет на мероприятие","Выбрать хороший парфюм","Подарить мягкий плед","Собрать подарочную корзину","Подарить беспроводные наушники","Выбрать необычный светильник","Подарить любимое угощение","Сделать персональный подарок","Подарить набор для хобби","Организовать небольшой праздник","Подарить совместное приключение"],
"Случайный выбор?":["Орёл","Решка","Первый вариант","Второй вариант","Сделать это сегодня","Отложить на завтра","Попробовать что-то новое","Сказать «да»","Сказать «нет»","Выбрать левый вариант","Выбрать правый вариант","Начать прямо сейчас","Сделать перерыв","Рискнуть и попробовать","Выбрать самый простой путь","Выбрать самый необычный путь","Довериться интуиции","Спросить совета","Принять решение за минуту","Устроить себе выходной","Сделать приятное близкому","Выйти на прогулку","Попробовать что-то впервые","Закончить начатое дело","Выбрать случайный вариант"]
};

const icons=["🎬","🍳","📍","✨","🎁","🎲"];
const names=Object.keys(data);
let current="";
let shown=[];
let selected="";
let result="";
let used={};

function read(key,fallback){
try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){return fallback}
}
function save(key,value){localStorage.setItem(key,JSON.stringify(value))}
let custom=read("customOptions",{});
let favorites=read("favorites",[]);
let history=read("history",[]);

function renderCategories(){
document.getElementById("categories").innerHTML=names.map((name,i)=>
`<button class="category" onclick="openCategory(${i})"><span class="emoji">${icons[i]}</span><strong>${name}</strong></button>`
).join("");
}
function openCategory(i){
current=names[i];
document.getElementById("home").style.display="none";
document.getElementById("saved").classList.remove("active");
document.getElementById("game").classList.add("active");
document.getElementById("categoryTitle").textContent=current;
selected="";
result="";
newOptions();
renderCustom();
}
function allOptions(){
return [...data[current],...(custom[current]||[])];
}
function newOptions(){
let all=allOptions();
if(!used[current])used[current]=[];
if(used[current].length>=all.length)used[current]=[];
let available=all.filter(x=>!used[current].includes(x));
available.sort(()=>Math.random()-.5);
shown=available.slice(0,5);
shown.forEach(x=>used[current].push(x));
selected="";
result="";
document.getElementById("result").textContent="Выбери один из вариантов";
renderOptions();
}
function renderOptions(){
document.getElementById("options").innerHTML=shown.map((x,i)=>
`<button class="option ${selected===x?"selected":""}" onclick="selectOption(${i})">${i+1}. ${escapeHTML(x)}</button>`
).join("");
}
function selectOption(i){
selected=shown[i];
renderOptions();
document.getElementById("result").textContent="Выбрано: "+selected;
}
function choose(){
if(!shown.length)return;
let value=selected||shown[Math.floor(Math.random()*shown.length)];
result=value;
selected=value;
document.getElementById("result").textContent="🎯 "+value;
renderOptions();
history.unshift({category:current,value,date:new Date().toLocaleString("ru-RU")});
history=history.slice(0,50);
save("history",history);
}
function addFavorite(){
let value=result||selected;
if(!value){alert("Сначала выбери вариант");return}
if(!favorites.some(x=>x.category===current&&x.value===value)){
favorites.unshift({category:current,value});
save("favorites",favorites);
}
alert("Добавлено в избранное!");
}
function addCustom(){
let input=document.getElementById("customInput");
let value=input.value.trim();
if(!value){alert("Напиши свой вариант");return}
if(allOptions().some(x=>x.toLowerCase()===value.toLowerCase())){
alert("Такой вариант уже есть");
return;
}
if(!custom[current])custom[current]=[];
custom[current].push(value);
save("customOptions",custom);
input.value="";
renderCustom();
newOptions();
}
function renderCustom(){
let list=custom[current]||[];
document.getElementById("customList").innerHTML=list.length?list.map((x,i)=>
`<div class="saveditem"><span>${escapeHTML(x)}</span><button class="delete" onclick="deleteCustom(${i})">Удалить</button></div>`
).join(""):'<div class="empty">Пока нет собственных вариантов</div>';
}
function deleteCustom(i){
if(!confirm("Удалить этот вариант?"))return;
custom[current].splice(i,1);
save("customOptions",custom);
renderCustom();
newOptions();
}
function showSaved(type){
document.getElementById("home").style.display="none";
document.getElementById("game").classList.remove("active");
document.getElementById("saved").classList.add("active");
document.getElementById("savedTitle").textContent=type==="favorites"?"Избранное":"История";
let list=type==="favorites"?favorites:history;
document.getElementById("savedList").innerHTML=list.length?list.map((x,i)=>
`<div class="saveditem"><div><strong>${escapeHTML(x.value)}</strong><div class="small">${escapeHTML(x.category)} ${x.date?"· "+escapeHTML(x.date):""}</div></div>${type==="favorites"?`<button class="delete" onclick="removeFavorite(${i})">Удалить</button>`:""}</div>`
).join(""):'<div class="empty">Здесь пока пусто</div>';
}
function removeFavorite(i){
favorites.splice(i,1);
save("favorites",favorites);
showSaved("favorites");
}
function goHome(){
document.getElementById("home").style.display="block";
document.getElementById("game").classList.remove("active");
document.getElementById("saved").classList.remove("active");
}
function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
renderCategories();
if("serviceWorker" in navigator){
window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
}
</script>
</body>
</html>
