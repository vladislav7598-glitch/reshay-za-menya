
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101016">
<link rel="manifest" href="./manifest.json">
<title>Решай за меня</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101016;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:600px;margin:auto;padding:22px 18px 50px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-size:23px;font-weight:800;letter-spacing:-.7px}
.logo span{color:#a78bfa}
.header-actions{display:flex;gap:8px}
.small-btn{background:#211d2d;color:#c4b5fd;padding:10px 12px;border-radius:12px}
h1{font-size:29px;line-height:1.15;margin:20px 0 8px}
.subtitle{color:#9995a5;font-size:14px;line-height:1.5;margin-bottom:25px}
.section-title{font-size:18px;font-weight:750;margin:28px 0 14px}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.category{min-height:112px;text-align:left;padding:17px;border-radius:19px;background:#1b1923;color:white;border:1px solid #2b2735;transition:.15s}
.category:active,.choice:active,.movie-card:active{transform:scale(.98)}
.category .emoji{font-size:26px;display:block;margin-bottom:12px}
.category strong{font-size:15px}
.category p{font-size:12px;color:#9b96a7;margin:6px 0 0}
.primary{width:100%;background:linear-gradient(135deg,#8b5cf6,#6d45d5);color:white;border-radius:15px;padding:16px;font-weight:750;margin-top:14px}
.secondary{background:#24202e;color:#ddd6fe;border:1px solid #383044;border-radius:14px;padding:13px}
.back{
display:inline-flex;
align-items:center;
gap:8px;
background:#302447;
border:1px solid #7652b8;
color:#fff;
padding:12px 17px;
border-radius:13px;
margin-bottom:16px;
font-size:15px;
font-weight:700;
transition:.15s;
}
.back:active{background:#6544a8;transform:scale(.97)}
.hidden{display:none!important}
.panel{background:#1b1923;border:1px solid #2b2735;border-radius:20px;padding:18px;margin-top:16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.choice{background:#211d2d;border:1px solid #383044;color:#fff;padding:18px 12px;border-radius:16px;text-align:center;font-weight:700}
.choice .emoji{display:block;font-size:27px;margin-bottom:9px}
.genre-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.genre{background:#211d2d;color:#eee;border:1px solid #383044;padding:13px 10px;border-radius:13px;text-align:center}
.genre.active{background:#6544a8;border-color:#a78bfa}
.search{width:100%;background:#1b1923;color:white;border:1px solid #393344;border-radius:13px;padding:14px;margin:12px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.filter{background:#211d2d;color:#c9c2d6;padding:9px 12px;border-radius:11px}
.filter.active{background:#6544a8;color:white}
.movie-list{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.movie-card{display:flex;gap:13px;background:#1b1923;border:1px solid #2b2735;border-radius:16px;padding:12px}
.poster{width:76px;min-width:76px;height:108px;border-radius:11px;background:linear-gradient(145deg,#7252bd,#252039);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff}
.movie-info{min-width:0;flex:1}
.movie-info h3{font-size:16px;margin:2px 0 6px}
.meta{font-size:12px;color:#a69fb2;margin-bottom:7px}
.description{font-size:12px;color:#c5bfce;line-height:1.45}
.card-actions{display:flex;gap:8px;margin-top:10px;align-items:center}
.card-actions button{background:#292435;color:#d8cafa;padding:8px 10px;border-radius:9px;font-size:12px}
.star{margin-left:auto;font-size:20px!important;padding:3px 7px!important}
.detail-title{font-size:25px;margin:4px 0 8px}
.detail-description{color:#c5bfce;line-height:1.6;font-size:14px}
.result{background:#211d2d;border:1px solid #44345f;padding:18px;border-radius:17px;margin-top:16px}
.result h2{margin:0 0 8px;font-size:21px}
.result p{color:#b8b1c3;font-size:13px;line-height:1.5}
.option-list{display:flex;flex-direction:column;gap:9px}
.option{display:flex;align-items:center;justify-content:space-between;background:#211d2d;padding:14px;border-radius:13px}
.option button{background:#382c4b;color:#e9ddff;border-radius:9px;padding:8px 10px}
.add-row{display:flex;gap:8px;margin-top:14px}
.add-row input{min-width:0;flex:1;background:#211d2d;color:white;border:1px solid #393344;border-radius:12px;padding:12px}
.empty{color:#9b96a5;text-align:center;padding:25px 10px;font-size:14px}
.history-item{padding:12px;background:#1b1923;border-radius:12px;margin:8px 0;color:#ddd}
@media(max-width:360px){.app{padding:18px 13px}.category{padding:14px}.logo{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">Решай <span>за меня</span></div>
  <div class="header-actions">
    <button class="small-btn" onclick="openSaved()">★</button>
    <button class="small-btn" onclick="openHistory()">История</button>
  </div>
</header>

<main id="home">
  <h1>Чего хочется?</h1>
  <div class="subtitle">Меньше сомнений — больше действий.</div>
  <div class="categories">
    <button class="category" onclick="openWatch()"><span class="emoji">🎬</span><strong>Что посмотреть?</strong><p>Фильмы и сериалы</p></button>
    <button class="category" onclick="openCategory('cook')"><span class="emoji">🍳</span><strong>Что приготовить?</strong><p>Идеи для еды</p></button>
    <button class="category" onclick="openCategory('go')"><span class="emoji">📍</span><strong>Куда сходить?</strong><p>Места и идеи</p></button>
    <button class="category" onclick="openCategory('do')"><span class="emoji">🎯</span><strong>Чем заняться?</strong><p>Идеи на любой день</p></button>
    <button class="category" onclick="openCategory('gift')"><span class="emoji">🎁</span><strong>Что подарить?</strong><p>Идеи подарков</p></button>
    <button class="category" onclick="openCategory('random')"><span class="emoji">🎲</span><strong>Случайный выбор</strong><p>Решение за секунду</p></button>
  </div>
</main>

<section id="watch" class="hidden">
  <button class="back" onclick="goHome()">← На главную</button>
  <h1>Что посмотреть?</h1>
  <div class="subtitle">Сначала выбери, что тебе больше хочется.</div>
  <div class="choices">
    <button class="choice" onclick="chooseType('movie')"><span class="emoji">🎬</span>Кино</button>
    <button class="choice" onclick="chooseType('series')"><span class="emoji">📺</span>Сериалы</button>
  </div>
  <button class="primary" onclick="randomFromAll()">🎲 Выбери за меня</button>
</section>

<section id="genres" class="hidden">
  <button class="back" onclick="openWatch()">← Назад</button>
  <h1 id="genreHeading">Выбери жанр</h1>
  <div class="subtitle">Можешь выбрать жанр сам или доверить выбор приложению.</div>
  <div class="genre-grid" id="genreGrid"></div>
  <button class="primary" onclick="randomByGenre()">🎲 Выбери за меня</button>
</section>

<section id="catalog" class="hidden">
  <button class="back" onclick="backToGenres()">← К жанрам</button>
  <h1 id="catalogHeading">Каталог</h1>
  <div class="subtitle" id="catalogSubtitle"></div>
  <input class="search" id="movieSearch" placeholder="Поиск по названию..." oninput="renderMovies()">
  <div class="filters">
    <button class="filter active" onclick="setCountry('Все',this)">Все страны</button>
    <button class="filter" onclick="setCountry('Россия',this)">Россия</button>
    <button class="filter" onclick="setCountry('Зарубежное',this)">Зарубежное</button>
  </div>
  <div id="movieList" class="movie-list"></div>
  <button class="secondary" style="width:100%;margin-top:16px" onclick="randomFromCatalog()">🎲 Выбери за меня</button>
</section>

<section id="detail" class="hidden">
  <button class="back" onclick="backFromDetail()">← Назад</button>
  <div class="panel">
    <div class="poster" id="detailPoster" style="width:100%;height:150px;font-size:48px"></div>
    <h2 class="detail-title" id="detailTitle"></h2>
    <div class="meta" id="detailMeta"></div>
    <p class="detail-description" id="detailDescription"></p>
    <button class="primary" id="detailFavorite" onclick="toggleDetailFavorite()">☆ В избранное</button>
  </div>
</section>

<section id="generic" class="hidden">
  <button class="back" onclick="goHome()">← На главную</button>
  <h1 id="genericTitle"></h1>
  <div class="subtitle">Выбери вариант или доверь решение приложению.</div>
  <div id="genericOptions" class="option-list"></div>
  <button class="primary" onclick="decideGeneric()">🎲 Выбери за меня</button>
  <div class="add-row">
    <input id="customInput" placeholder="Добавить свой вариант...">
    <button class="secondary" onclick="addCustom()">Добавить</button>
  </div>
  <div id="genericResult"></div>
</section>

<section id="saved" class="hidden">
  <button class="back" onclick="goHome()">← На главную</button>
  <h1>Избранное ★</h1>
  <div id="savedList"></div>
</section>

<section id="history" class="hidden">
  <button class="back" onclick="goHome()">← На главную</button>
  <h1>История</h1>
  <div id="historyList"></div>
</section>
</div>

<script>
const movies = [
{id:1,title:"Брат",type:"movie",year:1997,country:"Россия",genre:"Криминал",desc:"Молодой Данила Багров возвращается домой и оказывается втянут в криминальный мир Санкт-Петербурга."},
{id:2,title:"Брат 2",type:"movie",year:2000,country:"Россия",genre:"Боевик",desc:"Данила отправляется в США, чтобы помочь другу и разобраться с несправедливостью."},
{id:3,title:"Легенда №17",type:"movie",year:2013,country:"Россия",genre:"Драма",desc:"История хоккеиста Валерия Харламова и легендарного матча сборной СССР."},
{id:4,title:"Движение вверх",type:"movie",year:2017,country:"Россия",genre:"Драма",desc:"История баскетбольной сборной СССР перед Олимпиадой 1972 года."},
{id:5,title:"Холоп",type:"movie",year:2019,country:"Россия",genre:"Комедия",desc:"Мажор Гриша неожиданно оказывается в необычной исторической реальности."},
{id:6,title:"Майор Гром: Чумной Доктор",type:"movie",year:2021,country:"Россия",genre:"Боевик",desc:"Петербургский полицейский расследует серию громких преступлений."},
{id:7,title:"Интерстеллар",type:"movie",year:2014,country:"Зарубежное",genre:"Фантастика",desc:"Группа исследователей отправляется через космическую аномалию на поиски нового дома для человечества."},
{id:8,title:"Начало",type:"movie",year:2010,country:"Зарубежное",genre:"Фантастика",desc:"Команда специалистов проникает в сны людей, чтобы изменить их мысли."},
{id:9,title:"Побег из Шоушенка",type:"movie",year:1994,country:"Зарубежное",genre:"Драма",desc:"История дружбы, надежды и стремления к свободе в стенах тюрьмы."},
{id:10,title:"Матрица",type:"movie",year:1999,country:"Зарубежное",genre:"Фантастика",desc:"Хакер узнаёт, что привычный мир является искусственной реальностью."},
{id:11,title:"Гладиатор",type:"movie",year:2000,country:"Зарубежное",genre:"Боевик",desc:"Римский полководец становится гладиатором и ищет справедливости."},
{id:12,title:"Остров проклятых",type:"movie",year:2010,country:"Зарубежное",genre:"Триллер",desc:"Два федеральных маршала расследуют исчезновение пациентки психиатрической клиники."},
{id:13,title:"1+1",type:"movie",year:2011,country:"Зарубежное",genre:"Комедия",desc:"Необычная дружба меняет жизнь богатого аристократа и его помощника."},
{id:14,title:"Паразиты",type:"movie",year:2019,country:"Зарубежное",genre:"Триллер",desc:"Две семьи из разных социальных миров оказываются связаны неожиданным образом."},
{id:15,title:"Дюна",type:"movie",year:2021,country:"Зарубежное",genre:"Фантастика",desc:"Наследник знатного дома отправляется на опасную пустынную планету."},
{id:31,title:"Пираты Карибского моря",type:"movie",year:2003,country:"Зарубежное",genre:"Приключения",desc:"Капитан Джек Воробей отправляется навстречу опасным морским приключениям."},
{id:32,title:"Титаник",type:"movie",year:1997,country:"Зарубежное",genre:"Мелодрама",desc:"История любви двух молодых людей на борту знаменитого лайнера."},
{id:33,title:"Троя",type:"movie",year:2004,country:"Зарубежное",genre:"История",desc:"Эпическое повествование о войне между Троей и греческими царствами."},
{id:34,title:"Заклятие",type:"movie",year:2013,country:"Зарубежное",genre:"Ужасы",desc:"Исследователи паранормальных явлений сталкиваются с пугающей историей семьи."},
{id:16,title:"Бригада",type:"series",year:2002,country:"Россия",genre:"Криминал",desc:"История четырёх друзей и их пути в криминальном мире Москвы."},
{id:17,title:"Кухня",type:"series",year:2012,country:"Россия",genre:"Комедия",desc:"Жизнь и работа команды ресторана, где каждый день происходит что-то новое."},
{id:18,title:"Метод",type:"series",year:2015,country:"Россия",genre:"Детектив",desc:"Следователь использует необычные методы в расследовании сложных преступлений."},
{id:19,title:"Эпидемия",type:"series",year:2019,country:"Россия",genre:"Триллер",desc:"Группа людей пытается выжить во время неизвестной эпидемии."},
{id:20,title:"Слово пацана",type:"series",year:2023,country:"Россия",genre:"Драма",desc:"История подростков и уличных группировок Казани конца 1980-х."},
{id:21,title:"Триггер",type:"series",year:2018,country:"Россия",genre:"Драма",desc:"Психолог использует провокационный метод работы с пациентами."},
{id:22,title:"Во все тяжкие",type:"series",year:2008,country:"Зарубежное",genre:"Драма",desc:"Учитель химии начинает опасную двойную жизнь."},
{id:23,title:"Игра престолов",type:"series",year:2011,country:"Зарубежное",genre:"Фэнтези",desc:"Большие дома борются за власть над Семью королевствами."},
{id:24,title:"Шерлок",type:"series",year:2010,country:"Зарубежное",genre:"Детектив",desc:"Современная версия историй о знаменитом сыщике и докторе Ватсоне."},
{id:25,title:"Очень странные дела",type:"series",year:2016,country:"Зарубежное",genre:"Фантастика",desc:"В небольшом городе происходят загадочные события, связанные с другим измерением."},
{id:26,title:"Чернобыль",type:"series",year:2019,country:"Зарубежное",genre:"Драма",desc:"Драматическая история аварии на Чернобыльской АЭС и её последствий."},
{id:27,title:"Настоящий детектив",type:"series",year:2014,country:"Зарубежное",genre:"Детектив",desc:"Антология криминальных расследований и судеб людей, ведущих их."},
{id:28,title:"Мандалорец",type:"series",year:2019,country:"Зарубежное",genre:"Фантастика",desc:"Одинокий охотник за головами путешествует по далёкой галактике."},
{id:29,title:"Игра в кальмара",type:"series",year:2021,country:"Зарубежное",genre:"Триллер",desc:"Участники смертельно опасных игр борются за огромный денежный приз."},
{id:30,title:"Доктор Хаус",type:"series",year:2004,country:"Зарубежное",genre:"Драма",desc:"Гениальный, но непростой врач решает самые сложные медицинские загадки."}
];

const genres=["Все жанры","Боевик","Драма","Детектив","Комедия","Криминал","Триллер","Фантастика","Фэнтези","Приключения","Мелодрама","История","Ужасы"];
const genericData={
cook:{title:"Что приготовить?",items:["Паста","Пицца","Домашние котлеты","Курица с картошкой","Омлет","Борщ","Плов","Салат Цезарь","Блины","Запечённая рыба"]},
go:{title:"Куда сходить?",items:["В кино","В кафе","В парк","На прогулку","В музей","В боулинг","На природу","В торговый центр"]},
do:{title:"Чем заняться?",items:["Посмотреть фильм","Почитать книгу","Заняться спортом","Погулять","Приготовить что-нибудь","Послушать музыку","Сыграть в игру","Изучить что-то новое"]},
gift:{title:"Что подарить?",items:["Парфюм","Наушники","Книгу","Сертификат","Настольную игру","Аксессуар","Термокружку","Подарочный набор"]},
random:{title:"Случайный выбор",items:["Орёл","Решка","Сделать перерыв","Посмотреть фильм","Прогуляться","Попробовать новое","Отдохнуть","Заняться делом"]}
};

let currentType="movie",currentGenre="Все жанры",currentCountry="Все",currentMovie=null,detailFrom="catalog",genericKey="";
let favorites=JSON.parse(localStorage.getItem("favorites")||"[]");
let history=JSON.parse(localStorage.getItem("history")||"[]");
let customOptions=JSON.parse(localStorage.getItem("customOptions")||"{}");

function save(){localStorage.setItem("favorites",JSON.stringify(favorites));localStorage.setItem("history",JSON.stringify(history));localStorage.setItem("customOptions",JSON.stringify(customOptions))}
function hideAll(){["home","watch","genres","catalog","detail","generic","saved","history"].forEach(id=>document.getElementById(id).classList.add("hidden"))}
function show(id){hideAll();document.getElementById(id).classList.remove("hidden");window.scrollTo(0,0)}
function goHome(){show("home")}
function openWatch(){show("watch")}
function chooseType(type){currentType=type;currentGenre="Все жанры";document.getElementById("genreHeading").textContent=type==="movie"?"Жанры кино":"Жанры сериалов";renderGenres();show("genres")}
function renderGenres(){document.getElementById("genreGrid").innerHTML=genres.map(g=>`<button class="genre" onclick="chooseGenre('${g.replace(/'/g,"\\'")}')">${g}</button>`).join("")}
function chooseGenre(g){currentGenre=g;currentCountry="Все";document.getElementById("movieSearch").value="";document.querySelectorAll(".filter").forEach((b,i)=>b.classList.toggle("active",i===0));renderMovies();document.getElementById("catalogHeading").textContent=currentType==="movie"?"Каталог фильмов":"Каталог сериалов";document.getElementById("catalogSubtitle").textContent=g==="Все жанры"?"Все жанры":"Жанр: "+g;show("catalog")}
function backToGenres(){show("genres")}
function setCountry(country,button){currentCountry=country;document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));button.classList.add("active");renderMovies()}
function filteredMovies(){let q=document.getElementById("movieSearch").value.trim().toLowerCase();return movies.filter(m=>m.type===currentType&&(currentGenre==="Все жанры"||m.genre===currentGenre)&&(currentCountry==="Все"||m.country===currentCountry)&&m.title.toLowerCase().includes(q))}
function renderMovies(){let list=filteredMovies();document.getElementById("movieList").innerHTML=list.length?list.map(movieCard).join(""):'<div class="empty">Пока нет произведений в этом жанре. Скоро добавим!</div>'}
function movieCard(m){return `<div class="movie-card"><div class="poster">${m.title[0]}</div><div class="movie-info"><h3>${m.title}</h3><div class="meta">${m.year} · ${m.country} · ${m.genre}</div><div class="description">${m.desc}</div><div class="card-actions"><button onclick="openDetail(${m.id},'catalog')">Подробнее</button><button class="star" onclick="toggleFavorite(${m.id})">${isFavorite(m.id)?"★":"☆"}</button></div></div></div>`}
function isFavorite(id){return favorites.some(x=>x.movieId===id)}
function toggleFavorite(id){let m=movies.find(x=>x.id===id);if(isFavorite(id))favorites=favorites.filter(x=>x.movieId!==id);else favorites.push({movieId:id,title:m.title,type:m.type});save();renderMovies()}
function openDetail(id,from){let m=movies.find(x=>x.id===id);if(!m)return;currentMovie=m;detailFrom=from;document.getElementById("detailPoster").textContent=m.title[0];document.getElementById("detailTitle").textContent=m.title;document.getElementById("detailMeta").textContent=m.year+" · "+m.country+" · "+m.genre+" · "+(m.type==="movie"?"Фильм":"Сериал");document.getElementById("detailDescription").textContent=m.desc;document.getElementById("detailFavorite").textContent=isFavorite(id)?"★ В избранном":"☆ В избранное";addHistory(m.title);show("detail")}
function toggleDetailFavorite(){if(!currentMovie)return;toggleFavorite(currentMovie.id);document.getElementById("detailFavorite").textContent=isFavorite(currentMovie.id)?"★ В избранном":"☆ В избранное"}
function backFromDetail(){if(detailFrom==="catalog")show("catalog");else if(detailFrom==="saved")openSaved();else if(detailFrom==="genres")show("genres");else show("watch")}
function addHistory(title){history.unshift({title,date:new Date().toLocaleString("ru-RU")});history=history.slice(0,50);save()}
function randomFromAll(){let m=movies[Math.floor(Math.random()*movies.length)];openDetail(m.id,"watch")}
function randomByGenre(){let list=movies.filter(m=>m.type===currentType&&(currentGenre==="Все жанры"||m.genre===currentGenre));if(!list.length){alert("В этом жанре пока нет вариантов. Выбери другой жанр.");return}let m=list[Math.floor(Math.random()*list.length)];openDetail(m.id,"genres")}
function randomFromCatalog(){let list=filteredMovies();if(!list.length){alert("В каталоге пока нет подходящих вариантов.");return}let m=list[Math.floor(Math.random()*list.length)];openDetail(m.id,"catalog")}
function openCategory(key){genericKey=key;document.getElementById("genericTitle").textContent=genericData[key].title;document.getElementById("genericResult").innerHTML="";renderGeneric();show("generic")}
function renderGeneric(){let items=[...genericData[genericKey].items,...(customOptions[genericKey]||[])];document.getElementById("genericOptions").innerHTML=items.map((item,i)=>`<div class="option"><span>${item}</span><button onclick="removeCustom(${i})">×</button></div>`).join("")}
function addCustom(){let input=document.getElementById("customInput"),value=input.value.trim();if(!value)return;if(!customOptions[genericKey])customOptions[genericKey]=[];customOptions[genericKey].push(value);input.value="";save();renderGeneric()}
function removeCustom(i){let base=genericData[genericKey].items.length;if(i>=base){customOptions[genericKey].splice(i-base,1);save();renderGeneric()}}
function decideGeneric(){let items=[...genericData[genericKey].items,...(customOptions[genericKey]||[])];let result=items[Math.floor(Math.random()*items.length)];document.getElementById("genericResult").innerHTML=`<div class="result"><div class="meta">ТВОЙ ВАРИАНТ</div><h2>${result}</h2><p>Пусть сегодня решение будет за нас!</p></div>`;addHistory(result)}
function openSaved(){let list=document.getElementById("savedList");let savedMovies=favorites.filter(x=>x.movieId);let other=favorites.filter(x=>!x.movieId);list.innerHTML="";if(!savedMovies.length&&!other.length){list.innerHTML='<div class="empty">Здесь пока ничего нет.</div>';show("saved");return}savedMovies.forEach(x=>{let m=movies.find(a=>a.id===x.movieId);if(m)list.innerHTML+=movieCard(m)});other.forEach(x=>list.innerHTML+=`<div class="history-item">${x.title}</div>`);show("saved")}
function openHistory(){document.getElementById("historyList").innerHTML=history.length?history.map(x=>`<div class="history-item">${x.title}<div class="meta">${x.date}</div></div>`).join(""):'<div class="empty">История пока пуста.</div>';show("history")}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}
</script>
